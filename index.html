<script>
/* core.js */
(function(root){
  'use strict';
  const fresh = () => ({version:1, role:null, remember:false, points:0, crop:'corn', cycle:1, growth:0, planted:false, harvested:false, care:[], tips:[], logs:[], nature:false, previewSeason:null, teaching:false, woven:false, weaveRewarded:false, weaveRounds:0, badges:[], orders:[], packaging:'standard', journey:'plant'});
  function localParts(date,zone='Asia/Shanghai'){
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(date);
    return Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
  }
  function seasonAt(date, farm){
    const p=localParts(date,farm.timeZone);
    return Object.keys(farm.seasonMonths).find(s=>farm.seasonMonths[s].includes(p.month))||'spring';
  }
  function canPlant(crop,date,farm,previewSeason){
    if(previewSeason==='spring' && crop.id==='corn') return true;
    return crop.months.includes(localParts(date,farm.timeZone).month);
  }
  function stage(growth){return growth>=100?4:growth>=65?3:growth>=40?2:growth>0?1:0;}
  function care(state,task){
    if(!state.planted||state.harvested||state.care.includes(task.id)||state.growth>=100)return false;
    state.care.push(task.id); state.points+=task.points; state.growth=Math.min(100,state.growth+task.growth);
    if(state.care.length>=3)state.growth=100;
    return true;
  }
  function quiz(state,id,correct){
    if(!correct||state.tips.includes(id))return false;
    state.tips.push(id); state.points+=20;
    if(state.planted&&!state.harvested)state.growth=Math.min(100,state.growth+15);
    return true;
  }
  function accelerate(state){
    if(!state.planted||state.harvested||state.growth>=100||state.points<20)return false;
    state.points-=20;state.growth=Math.min(100,state.growth+15);return true;
  }
  function completeWeave(state){
    state.woven=true;
    if(!state.weaveRewarded){state.points+=10;state.weaveRewarded=true;}
  }
  function packing(state,season){
    // 同一次收获的搭配稳定；重开页面不会反复抽取更高价值物品。
    const seed=state.cycle*17+state.care.length*7+state.tips.length*3;
    const candidates=state.crop==='corn'?['清洁干燥的玉米苞叶（候选）','玉米秸秆纹样纸卡','再生纸缓冲（候选）']:['再生纸缓冲（候选）','作物纹样纸卡'];
    return {filler:candidates[seed%candidates.length], memory:season==='autumn'?'秋叶纹样小卡':'这一季的生长记录卡', growthCard:true};
  }
  function orderAllowed(state,crop){return Boolean(state.harvested&&crop.sellable&&['ready','ordered'].includes(state.journey));}
  function nextCycle(state){
    Object.assign(state,{cycle:state.cycle+1,growth:0,planted:false,harvested:false,care:[],nature:false,teaching:false,packaging:'standard',journey:'plant'});
  }
  function safeLoad(value){
    try{
      const s=JSON.parse(value);if(!s||s.version!==1)return fresh();
      const n=Object.assign(fresh(),s);
      n.points=Math.max(0,Number(n.points)||0);n.growth=Math.max(0,Math.min(100,Number(n.growth)||0));
      ['care','tips','logs','badges','orders'].forEach(k=>{if(!Array.isArray(n[k]))n[k]=[];});
      return n;
    }catch{return fresh();}
  }
  const api={fresh,localParts,seasonAt,canPlant,stage,care,quiz,accelerate,completeWeave,packing,orderAllowed,nextCycle,safeLoad};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
  root.XunsuCore=api;
})(typeof window!=='undefined'?window:globalThis);

</script>

  function open(content){modal.innerHTML=`<div class="modal-content">${content}</div>`;if(!modal.open)modal.showModal();modal.scrollTop=0;}

  function openCrops(){

    open(heading('CHOOSE A SEED','想从哪一粒种子开始？',`${D.seasons[realSeason()].name}季 · 按示范产区的播种窗判断，真实农时待种植地校准。`)+`<div class="crop-grid">${D.crops.map(c=>{const allowed=C.canPlant(c,new Date(),D.farm,state.previewSeason);return `<div class="crop-card">${icon(c.icon)}<strong>${c.name}</strong><p>${c.intro}</p><span class="tag">${c.window}</span><p>${allowed?'当前可体验播种':c.id==='corn'?'已过示范播种期':'请等待合适的播种期'}${c.sellable?'':' · 拓展作物体验'}</p>${btn(allowed?'种下这一粒':c.id==='corn'?'进入春播体验':'等待当季',allowed?'plant':c.id==='corn'?'preview-corn':'noop',allowed?'primary':'outline',`data-crop="${c.id}" ${!allowed&&c.id!=='corn'?'disabled':''}`)}</div>`;}).join('')}</div><div class="info-box warm">春播体验会单独标注，不改变真实日期。游戏中的成长与积分不代表有一株实物正在同步生长。</div>`);

  function plant(id,preview=false){ensureRole(()=>{

  });}
  function takeCare(id){ensureRole(()=>{

  });}
  function openTips(id){activeTip=id||D.tips.find(t=>!state.tips.includes(t.id))?.id||'filler';const t=D.tips.find(t=>t.id===activeTip)||D.tips[0];open(heading('LITTLE GREEN TIPS',t.title,'读一张小卡，做一个轻轻的选择。每个锦囊首次答对可得20积分。')+`<div class="tip-tabs">${D.tips.map(v=>`<button class="${v.id===t.id?'active':''}" data-action="tip-tab" data-tip="${v.id}">${v.tag}${state.tips.includes(v.id)?' ✓':''}</button>`).join('')}</div><p class="tip-body">${t.text}</p><div class="tip-options">${t.options.map((v,n)=>`<button class="tip-option" data-action="answer" data-answer="${n}">${String.fromCharCode(65+n)}. ${v}</button>`).join('')}</div><div class="tip-result" id="tip-result">${state.tips.includes(t.id)?'这个锦囊已完成，再看看也很好。':''}</div><div class="rule"></div><button class="text-button" data-action="close">先回田地，稍后再读 ${icon('arrow')}</button>`);}

  function openWeave(){open(heading('A LITTLE WEAVING','让经纬，慢慢相遇。','学一小段编织，把材料的时间看在眼里。')+`<div class="weave-layout"><div class="weave-board" aria-label="经纬编织示意">${Array.from({length:64},(_,n)=>`<span class="weave-cell done ${(Math.floor(n/8)+n%8)%2?'over':''}"></span>`).join('')}</div><div class="weave-help"><h3>普通编织款 · 体验工坊</h3><p>交替选择“从左穿入”和“从右穿入”，完成8行编织。首次完成可得10积分与一枚手作徽章。</p><p>首次体验免费，再次进入消耗10积分。完成后，可用30积分兑换普通编织外包装。</p><div class="info-box">游戏为平纹编织示意。实物由真实农户或手作伙伴制作，款式与材料需在合作后确认。</div>${btn(state.weaveRounds?'再编一次 · 10积分':'开始编织 · 初次免费','start-weave','primary block')}</div></div>`);}

  function selectPack(id){if(!['standard','eco','woven'].includes(id))return;if(id==='woven'&&state.points<D.commerce.wovenPoints){toast('普通编织外包装需要30积分，可先继续照料或完成环保锦囊。');return;}state.packaging=id;save();openPacking();}

  function openCheckout(){if(!ready()){openShop();return;}const existing=state.orders.find(o=>o.cycle===state.cycle);if(existing){showOrder(existing);return;}open(heading('YOUR LITTLE HARVEST','确认这一季的小小收获。','本地交易演示：不会扣款，不会安排真实发货。')+`<div class="order-line"><span>作物与数量</span><strong>${crop().name} · 示例双穗装</strong></div><div class="order-line"><span>种植场景</span><strong>${D.seasons[season()].name}季 · ${state.teaching?'教学体验地':'示范季候'}</strong></div><div class="order-line"><span>本季照料</span><strong>${state.care.length}项照料 · ${state.growth}%成长</strong></div><div class="order-line"><span>包装选择</span><strong>${packName()} <button class="text-button" data-action="packing">修改</button></strong></div><div class="order-line"><span>运费</span><strong>真实发货前按地区确认</strong></div><div class="order-summary"><span class="small muted">体验合计（不含真实运费）</span><div class="order-price">¥${total()}<small>示例金额</small></div></div><div class="shipping-grid"><label class="input-label">体验称呼（选填，不保存）<input id="demo-alias" maxlength="24" autocomplete="off" placeholder="例如：田野的新朋友"></label><label class="input-label">体验收货地区（选填，不保存）<input id="demo-region" maxlength="60" autocomplete="off" placeholder="请勿填写真实详细地址"></label></div><label class="consent-row"><input id="order-consent" type="checkbox"><span>同意将本次作物、季节、照料次数和包装选项用于生成体验订单。我知道这里不会发生扣款或真实发货。</span></label><div class="info-box warm">真实案主、库存和支付尚未接入。此订单用于测试完整流程，不构成真实交易。</div>${btn('生成体验订单 · 不扣款','place-order','primary block')}<button class="text-button" data-action="cases">再看看卖家与案主资料 ${icon('arrow')}</button>`);}

    state.orders.unshift(order);state.journey='ordered';badge('一份绿色心意');log('生成了体验订单（不扣款、不发货）');commit();tick();showOrder(order);
  }
  function showOrder(o){open(heading('A LITTLE GIFT, A LONG STORY','这一季，已经收进记忆。','体验订单已生成。没有扣款，也没有产生真实物流。')+`<div class="info-box">体验编号：${esc(o.id)}<br>时间：${new Date(o.at).toLocaleString('zh-CN')}<br>${D.crops.find(c=>c.id===o.crop)?.name||'文玩玉米'} · ${esc({standard:'标准包装',eco:'环保探索款',woven:'普通编织外包装'}[o.packaging])}<br>材料搭配建议：${esc(o.filler)}</div><div class="order-status"><div><b>✓</b>体验已完成<small>保留本季必要摘要</small></div><div><b>2</b>真实卖家确认<small>待产地、库存与价格</small></div><div><b>3</b>支付与物流接入<small>接入后才可实物发货</small></div></div><div class="rule"></div><p class="tip-body">这次小小的照料，希望让你愿意多了解一片土地、一段手艺，以及一份包装的去向。</p><div class="settings-controls" style="margin-top:24px">${btn('再走进田地','back-farm','primary')}${btn('查看我的手记','records','outline')}</div>`);}
  function openOrders(){if(!state.orders.length){open(heading('MY LITTLE HARVESTS','还没有体验订单。','成熟、收获并选好包装后，就可以走一遍完整的选购流程。')+btn('看看本季产品','shop','primary block'));return;}open(heading('MY LITTLE HARVESTS','你与土地的小小连接。','以下均为本地体验记录，不是已付款或已发货订单。')+state.orders.map(o=>`<button class="research-card" style="width:100%;text-align:left" data-action="order" data-order="${esc(o.id)}"><div><strong>${esc(o.id)}</strong><span class="tag">本地体验</span></div><p>第${o.cycle}季 · ${esc(D.crops.find(c=>c.id===o.crop)?.name)} · 示例金额 ¥${o.total}</p></button>`).join(''));}
  function openCases(){open(heading('THE PEOPLE BEHIND THE FIELD','让真实的人，慢慢走到你面前。','发起者与7位守村人的资料需本人核实并授权，这里不会用虚构故事代替。')+`<div class="case-grid">${D.cases.map(c=>`<button class="case-card" data-action="case" data-case="${c.id}">${icon('user')}<strong>${c.name}</strong><small>${c.label}</small></button>`).join('')}</div><div class="info-box">将展示：授权肖像、种植地、本人心愿、批次生长照片与昼夜记录。现在保留资料位置，不把插画当作种植实拍。</div><h3 style="font-size:14px;font-weight:500;margin:24px 0 12px">项目从0到1</h3><div class="review-check done">${icon('check')}梳理农户、手工业者与消费者的需求</div><div class="review-check done">${icon('check')}形成减塑包装、共创与经济可行性方向</div><div class="review-check">${icon('sprout')}接入真实案主、种植批次与生长图片</div><div class="review-check">${icon('box')}比较保护、减塑、人工成本与运输条件</div><div class="review-check">${icon('truck')}确认卖家、支付、订单与实物物流</div>`);}
  function openCase(id){const c=D.cases.find(c=>c.id===id);if(!c)return;open(heading('A WISH WITH A NAME',esc(c.name),c.label)+`<div class="product-art" style="min-height:160px">${icon('user')}</div><div class="info-box">${c.note}</div><p class="research-detail">第一人称心愿：待本人授权录入。<br>真实生长照片：待核实作物、地点、日期与批次后展示。<br>售卖身份：待卖家资料和供货能力确认。</p><div class="rule"></div>${btn('返回案主卡','cases','outline block')}`);}
  function openResearch(n){const c=D.research[n];if(!c)return;open(heading('LISTEN BEFORE WE MAKE',c.name,c.tag)+`<p class="research-detail">${c.note}</p><div class="info-box">内容根据本项目已提供的调研记录归纳。这里没有将归纳写成访谈原话，也不表示该对象已成为售卖伙伴。</div>${btn('看看包装怎么回应这些需要','packing','primary block')}`);}
  function openRecords(){open(heading('MY FIELD NOTES','每一次照料，都留在这里。',`${state.logs.length}条记录 · ${state.remember?'仅存此设备':'临时体验，未保存到设备'}`)+`<div class="badges">${state.badges.length?state.badges.map(v=>`<span class="badge">${icon('badge')}${esc(v)}</span>`).join(''):'<span class="small muted">种下第一粒种子，就能获得你的第一枚徽章。</span>'}</div><div class="log-list" style="max-height:350px">${state.logs.length?state.logs.map(l=>`<div class="log-item"><span class="log-time">第${l.cycle}季</span><span>${esc(l.text)}<small style="display:block;color:#9ba58d">${new Date(l.at).toLocaleString('zh-CN')}</small></span></div>`).join(''):'<div class="empty">你的田间手记还没有脚印。</div>'}</div><div class="rule"></div>${btn('导出我的耕种手记 '+icon('download'),'export','outline')}`);}
  function exportRecords(){const data={project:'循塑 Xunsu',exportedAt:new Date().toISOString(),role:role()?.short||null,crop:crop().name,teaching:Boolean(state.teaching),cycle:state.cycle,growth:state.growth,points:state.points,care:state.care,tips:state.tips,logs:state.logs,badges:state.badges,orders:state.orders};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='循塑_我的田间手记.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('手记已导出，只包含必要的游戏记录。');}
  function openPoints(){open(heading('SMALL ACTIONS, GROWING VALUE','一点照料，一点积累。','耕种积分只用于体验权益，不是现金或可提现余额。')+`<div class="order-price">${state.points}<small>耕种积分</small></div><div class="rule"></div><div class="order-line"><span>播种一次</span><strong>+10积分 / 季</strong></div><div class="order-line"><span>浇水、观察与土壤照料</span><strong>各+15积分 / 季</strong></div><div class="order-line"><span>环保锦囊首次答对</span><strong>各+20积分</strong></div><div class="order-line"><span>观察当季自然元素</span><strong>+3积分 / 季</strong></div><div class="order-line"><span>首次完成编织</span><strong>+10积分</strong></div><div class="rule"></div><div class="order-line"><span>教学生长加速</span><strong>20积分 / 次</strong></div><div class="order-line"><span>再次进入编织体验</span><strong>10积分 / 次</strong></div><div class="order-line"><span>普通编织外包装兑换</span><strong>30积分 + 完成编织</strong></div><p class="privacy-small">解锁资格来自种植与打包。积分不会提升真实库存优先级，非遗联名权益待合作确认。</p>`);}
  function openSeasons(){open(heading('FOLLOW THE SEASON','土地，有自己的时间。','场景随种植地配置的时区与季候自动变化。当前产地尚待核实，使用华北月份示例。')+`<div class="info-box">当前真实日期：${new Intl.DateTimeFormat('zh-CN',{timeZone:D.farm.timeZone,dateStyle:'long'}).format(new Date())}<br>当前季候参考：${D.seasons[realSeason()].name}季<br>文玩玉米示例播种窗：4—6月；品种与产地确定后需重新校准。</div><div class="season-choices">${['spring','summer','autumn','winter'].map(id=>`<button class="${season()===id?'active':''}" data-action="preview-season" data-season="${id}">${D.seasons[id].name}</button>`).join('')}</div><p class="privacy-small">上方按钮仅用于体验季节画面。春播教学可种文玩玉米；其他体验画面不会放宽当前的真实播种窗口。</p><div class="rule"></div>${btn('回到真实日期的季候','real-season','outline')}`);}
  function openSettings(){open(heading('YOUR LITTLE SETTINGS','让体验，按你的节奏来。')+`<div class="settings-controls">${btn(soundOn?'关闭环境音':'开启环境音','sound','outline')}${btn('查看四季与农时','seasons','outline')}${btn('更换身份，保留进度','roles','outline')}</div><div class="rule"></div><p class="tip-body">${state.remember?'你已同意在本机保存游戏摘要。':'你正在临时体验，关闭页面后进度可能丢失。'}不上传个人游戏数据，不追踪浏览行为。</p><div class="settings-controls" style="margin-top:15px">${btn(state.remember?'关闭本机保存':'允许仅在本机保存','toggle-save','secondary')}${btn('导出我的手记','export','outline')}</div><div class="rule"></div><p class="small muted">${state.harvested?'这块地已经收获，可以开启下一季。':'新一季从收获开始，照料中的地块会保留。'}</p><div class="settings-controls" style="margin-top:15px">${btn('开启下一季','next-cycle','outline',state.harvested?'':'disabled')}${btn('清除本机体验数据','reset-prompt','outline')}</div>`);}
  function openPrivacy(){open(heading('ONLY WHAT IS NEEDED','进度留在这里，选择留给你。')+`<p class="research-detail">你可以临时体验，也可以明确同意在本机保存：身份视角、作物、教学季节、照料记录、积分、徽章、包装选择和演示订单摘要。<br><br>网站没有分析埋点，不上传上述数据。体验订单的称呼与地区不会保存，也不需要真实姓名、电话或详细地址。<br><br>导出仅包含这些必要游戏字段；可以随时关闭保存或清除记录。未来接入真实支付与物流时，需要另行说明收货信息、服务商与保留期限，并取得授权。</p><div class="rule"></div>${btn(state.remember?'停止本机保存':'同意仅在本机保存进度','toggle-save','primary')}`);}
  function toggleSave(){state.remember=!state.remember;if(!state.remember)try{localStorage.removeItem(storageKey);}catch{}else save();render();modal.close();toast(state.remember?'已开启本机保存，不会上传游戏数据。':'已停止保存并删除本机缓存；当前页面的进度仍可继续。');}
  function audioToggle(){
    if(soundOn){audio?.ctx.suspend();soundOn=false;render();toast('环境音已关闭。');return;}
    try{
      if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;const ctx=new Audio();const buffer=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate);const ch=buffer.getChannelData(0);let last=0;for(let n=0;n<ch.length;n++){last=(last+(Math.random()*2-1)*.022)/1.02;ch[n]=last*3.5;}const noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=season()==='winter'?350:700;const gain=ctx.createGain();gain.gain.value=.075;noise.connect(filter).connect(gain).connect(ctx.destination);noise.start();audio={ctx,filter,noise,gain};audio.birds=setInterval(()=>{if(!soundOn||document.hidden||season()==='winter')return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(1200,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(2100,ctx.currentTime+.13);g.gain.setValueAtTime(.012,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.3);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.32);},season()==='summer'?7000:12000);}
      audio.ctx.resume();soundOn=true;render();toast('田野的声音，轻轻打开了。');
    }catch{toast('当前浏览器暂不支持环境音，视觉体验仍可继续。');}
  }
  function backFarm(){modal.close();document.getElementById('farm').scrollIntoView({behavior:'smooth'});}
  function previewSeason(id){if(!D.seasons[id])return;state.previewSeason=id;save();render();modal.close();document.querySelector('.field-card').classList.add('season-transition');toast(`${D.seasons[id].name}季画面体验，真实日期和种植批次未改变。`);}
  const handlers={
    roles:openRoles,'choose-role':e=>chooseRole(e.dataset.role),close:()=>{followRole=null;modal.close();},crops:()=>ensureRole(openCrops),
    plant:e=>plant(e.dataset.crop),'preview-corn':()=>plant('corn',true),care:e=>takeCare(e.dataset.task),accelerate,nature,
    tips:()=>openTips(),life:()=>openTips('life'),'tip-tab':e=>openTips(e.dataset.tip),answer:e=>answer(Number(e.dataset.answer),e),
    weave:openWeave,'start-weave':startWeave,'weave-left':()=>weave('left'),'weave-right':()=>weave('right'),harvest,packing:openPacking,'select-pack':e=>selectPack(e.dataset.pack),'finish-pack':finishPack,
    shop:openShop,checkout:openCheckout,'place-order':placeOrder,orders:openOrders,order:e=>{const o=state.orders.find(o=>o.id===e.dataset.order);if(o)showOrder(o);},
    cases:openCases,case:e=>openCase(e.dataset.case),research:e=>openResearch(Number(e.dataset.research)),records:openRecords,export:exportRecords,points:openPoints,seasons:openSeasons,settings:openSettings,privacy:openPrivacy,'toggle-save':toggleSave,sound:audioToggle,
    'back-farm':backFarm,'preview-season':e=>previewSeason(e.dataset.season),'real-season':()=>{state.previewSeason=null;commit();modal.close();toast('已回到真实日期的季候参考。已种下的体验作物与记录保留。');},
    heritage:()=>open(heading('A COLLABORATION TO GROW','为真正的手艺，留一个位置。','非遗联名尚未开放购买或积分加成。')+'<p class="research-detail">需要先与相关机构和传承人确认合作、署名、实物款式、制作周期和合理的劳动报酬，再发布真实作品。</p><div class="info-box">目前可体验普通平纹编织。这里没有使用未经确认的非遗传承人身份或联名宣传。</div>'+btn('先体验普通编织','weave','primary block')),
    'next-cycle':()=>{if(!state.harvested)return;C.nextCycle(state);log('为新的这一季准备好土地');commit();modal.close();openCrops();},
    'reset-prompt':()=>open(heading('A FRESH LITTLE START','要清除这台设备的体验记录吗？','这会清除种植进度、积分与体验订单；不会影响任何真实交易。')+btn('先导出我的手记','export','outline block')+'<div style="height:12px"></div>'+btn('清除并重新开始','reset','primary block')),
    reset:()=>{try{localStorage.removeItem(storageKey);}catch{}state=C.fresh();modal.close();render();toast('本机记录已清除，新的一季在等你。');},noop:()=>{}
  };
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const handler=handlers[el.dataset.action];if(handler)handler(el);});
  modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){followRole=null;modal.close();}}});
  modal.addEventListener('cancel',()=>{followRole=null;});
  document.addEventListener('keydown',e=>{if(!modal.open||!modal.querySelector('[data-action="weave-left"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();weave(e.key==='ArrowLeft'?'left':'right');}});
  document.addEventListener('visibilitychange',()=>{if(audio){if(document.hidden)audio.ctx.suspend();else if(soundOn)audio.ctx.resume();}});
  // 浏览器重新可见时及每分钟校准产区时钟；跨季时不清空种植进度。
  setInterval(()=>{if(document.hidden)return;const now=new Date();const next=C.seasonAt(now,D.farm),hour=C.localParts(now,D.farm.timeZone).hour;const changed=next!==lastSeason||hour!==lastHour;lastSeason=next;lastHour=hour;if(!modal.open){render();if(changed)document.querySelector('.field-card')?.classList.add('season-transition');}},60000);
  render();
})();

</script>
